<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="820" height="470" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="425" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    الملخص البصري الشامل لقواعد الاشتقاق والعمليات على الدوال المشتقة
  </text>
  <text x="425" y="70" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Formules de Dérivation Fondamentales - المنهاج الجزائري للثانية ثانوي
  </text>

  <!-- Grid of 6 Rule Cards -->
  <!-- Card 1: Addition & Scalar -->
  <g transform="translate(45, 90)">
    <rect width="240" height="115" fill="#ffffff" rx="8" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="240" height="32" fill="#eff6ff" rx="8 8 0 0"/>
    <text x="120" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">1. مجموع وضرب في عدد ثابت</text>
    <text x="120" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">(u + v)' = u' + v'</text>
    <text x="120" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">(k · u)' = k · u'</text>
  </g>

  <!-- Card 2: Product -->
  <g transform="translate(305, 90)">
    <rect width="240" height="115" fill="#ffffff" rx="8" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="32" fill="#f0fdf4" rx="8 8 0 0"/>
    <text x="120" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">2. جداء دالتين (Produit)</text>
    <text x="120" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">(u · v)' = u'v + uv'</text>
    <text x="120" y="92" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">مشتق الأول في الثاني + مشتق الثاني في الأول</text>
  </g>

  <!-- Card 3: Quotient & Inverse -->
  <g transform="translate(565, 90)">
    <rect width="240" height="115" fill="#ffffff" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="240" height="32" fill="#fefce8" rx="8 8 0 0"/>
    <text x="120" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">3. حاصل قسمة ومقلوب دالة</text>
    <text x="120" y="58" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">(u / v)' = (u'v - uv') / v²</text>
    <text x="120" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">(1 / v)' = -v' / v²</text>
  </g>

  <!-- Card 4: Power of function -->
  <g transform="translate(45, 225)">
    <rect width="240" height="115" fill="#ffffff" rx="8" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="240" height="32" fill="#f5f3ff" rx="8 8 0 0"/>
    <text x="120" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">4. قوة دالة (uⁿ)</text>
    <text x="120" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">(uⁿ)' = n · u' · uⁿ⁻¹</text>
    <text x="120" y="92" font-family="sans-serif" font-size="12" fill="#6d28d9" text-anchor="middle">مثال: [(2x+1)³]' = 3(2)(2x+1)²</text>
  </g>

  <!-- Card 5: Square Root of function -->
  <g transform="translate(305, 225)">
    <rect width="240" height="115" fill="#ffffff" rx="8" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="240" height="32" fill="#fdf2f8" rx="8 8 0 0"/>
    <text x="120" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d174d" text-anchor="middle">5. جذر دالة (√u)</text>
    <text x="120" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">(√u)' = u' / (2√u)</text>
    <text x="120" y="92" font-family="sans-serif" font-size="12" fill="#9d174d" text-anchor="middle">الشرط: u(x) &gt; 0 تماماً</text>
  </g>

  <!-- Card 6: Composite f(ax + b) -->
  <g transform="translate(565, 225)">
    <rect width="240" height="115" fill="#ffffff" rx="8" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="240" height="32" fill="#ecfeff" rx="8 8 0 0"/>
    <text x="120" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0e7490" text-anchor="middle">6. تركيب دالة مع تآلفية</text>
    <text x="120" y="62" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">[f(ax + b)]' = a · f'(ax + b)</text>
    <text x="120" y="92" font-family="sans-serif" font-size="12" fill="#0e7490" text-anchor="middle">مثال: [cos(3x+1)]' = -3 sin(3x+1)</text>
  </g>

  <!-- Common Derivatives Table Footer -->
  <rect x="45" y="360" width="760" height="105" fill="#ffffff" rx="8" stroke="#cbd5e1"/>
  <text x="425" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">مشتقات الدوال المألوفة الأساسية :</text>
  <text x="80" y="415" font-family="sans-serif" font-size="13" fill="#2563eb">• (c)' = 0</text>
  <text x="210" y="415" font-family="sans-serif" font-size="13" fill="#2563eb">• (x)' = 1</text>
  <text x="340" y="415" font-family="sans-serif" font-size="13" fill="#2563eb">• (xⁿ)' = n · xⁿ⁻¹</text>
  <text x="500" y="415" font-family="sans-serif" font-size="13" fill="#2563eb">• (1/x)' = -1 / x²</text>
  <text x="670" y="415" font-family="sans-serif" font-size="13" fill="#2563eb">• (√x)' = 1 / (2√x)</text>
  <text x="210" y="445" font-family="sans-serif" font-size="13" fill="#dc2626">• [sin(x)]' = cos(x)</text>
  <text x="500" y="445" font-family="sans-serif" font-size="13" fill="#dc2626">• [cos(x)]' = -sin(x)</text>
</svg>