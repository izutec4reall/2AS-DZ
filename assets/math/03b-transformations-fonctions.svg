<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="420" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    التحويلات النقطية والانسحاب لتمثيل الدوال : g(x) = f(x + a) + b
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    منحنى (Cg) هو صورة (Cf) بالانسحاب الذي شعاعه v(-a, b) وقواعد القيمة المطلقة
  </text>

  <!-- Axes: Origin (300, 260) -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#334155" stroke-width="2"/>
  <text x="725" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">x</text>
  <line x1="300" y1="410" x2="300" y2="90" stroke="#334155" stroke-width="2"/>
  <text x="305" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">y</text>

  <!-- Original Parabola (Cf): f(x) = 0.02 * x^2 centered at (300, 260) -->
  <path d="M 180 140 Q 300 260 420 140" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="300" cy="260" r="4" fill="#1e40af"/>
  <text x="430" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">(Cf): y = f(x)</text>

  <!-- Translated Parabola (Cg): g(x) = f(x - 2) + 1.5 -> shifted right by 100px (a=-2) and up by 70px (b=+1.5) -->
  <!-- New vertex: (400, 190) -->
  <path d="M 280 70 Q 400 190 520 70" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="400" cy="190" r="4" fill="#dc2626"/>
  <text x="530" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">(Cg): y = f(x - a) + b</text>

  <!-- Translation Vector v from (300, 260) to (400, 190) -->
  <line x1="300" y1="260" x2="395" y2="195" stroke="#059669" stroke-width="3"/>
  <polygon points="400,190 388,193 394,204" fill="#059669"/>
  <text x="365" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">v(-a, b)</text>

  <!-- Vector components -->
  <line x1="300" y1="260" x2="400" y2="260" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="400" y1="260" x2="400" y2="190" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="350" y="278" font-family="sans-serif" font-size="12" fill="#059669">-a (إزاحة أفقية)</text>
  <text x="410" y="230" font-family="sans-serif" font-size="12" fill="#059669">+b (إزاحة شاقولية)</text>

  <!-- Summary Table Card -->
  <rect x="50" y="320" width="700" height="90" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
  <text x="400" y="345" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">قواعد التمثيل البياني انطلاقاً من (Cf) :</text>
  <text x="400" y="370" font-family="sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">
    1) y = f(x) + k : انسحاب بشعاع k·j  |  2) y = f(x + k) : انسحاب بشعاع -k·i  |  3) y = -f(x) : تناظر بالنسبة لمحور الفواصل
  </text>
  <text x="400" y="395" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">
    4) y = |f(x)| : الجزء الواقع فوق محور الفواصل يبقى كما هو، والجزء السفلي يناظر بالنسبة لمحور الفواصل نحو الأعلى
  </text>
</svg>