<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="auto">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <text x="450" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">
    التمثيلات البيانية للدوال المرجعية الأساسية (Fonctions de Référence)
  </text>

  <!-- PANEL 1: f(x) = x^2 (Top-Left) -->
  <g transform="translate(30, 60)">
    <rect width="400" height="260" fill="#f8fafc" rx="8" stroke="#cbd5e1"/>
    <text x="200" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">دالة مربع: f(x) = x²</text>
    <text x="200" y="50" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">متناقصة على ]-∞, 0] ومتزايدة على [0, +∞[ (دالة زوجية)</text>
    <!-- Axes: Origin (200, 210) -->
    <line x1="30" y1="210" x2="370" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="200" y1="245" x2="200" y2="60" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- Parabola: 1 unit = 35 px. y = (x/35)^2 * 35 -> y_px = 210 - (x_val^2)*28 -->
    <!-- Points: x=-2 -> x=130, y=98; x=-1 -> x=165, y=182; x=0 -> x=200, y=210; x=1 -> x=235, y=182; x=2 -> x=270, y=98 -->
    <path d="M 95 65 Q 200 240 305 65" fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="200" cy="210" r="4" fill="#1e40af"/>
    <circle cx="165" cy="182" r="3.5" fill="#2563eb"/>
    <circle cx="235" cy="182" r="3.5" fill="#2563eb"/>
    <circle cx="130" cy="98" r="3.5" fill="#2563eb"/>
    <circle cx="270" cy="98" r="3.5" fill="#2563eb"/>
    <text x="280" y="100" font-family="sans-serif" font-size="11" fill="#2563eb">(2, 4)</text>
    <text x="85" y="100" font-family="sans-serif" font-size="11" fill="#2563eb">(-2, 4)</text>
    <text x="320" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Parabole</text>
  </g>

  <!-- PANEL 2: f(x) = 1/x (Top-Right) -->
  <g transform="translate(470, 60)">
    <rect width="400" height="260" fill="#f8fafc" rx="8" stroke="#cbd5e1"/>
    <text x="200" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">دالة مقلوب: f(x) = 1/x</text>
    <text x="200" y="50" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">متناقصة تماماً على ]-∞, 0[ وعلى ]0, +∞[ (دالة فردية)</text>
    <!-- Axes: Origin (200, 140) -->
    <line x1="30" y1="140" x2="370" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="200" y1="245" x2="200" y2="60" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- Hyperbola branches -->
    <!-- Positive branch: (200+x, 140 - 1400/x) -->
    <path d="M 220 70 Q 235 115 270 128 T 360 135" fill="none" stroke="#059669" stroke-width="3"/>
    <!-- Negative branch -->
    <path d="M 40 145 Q 130 152 165 165 T 180 210" fill="none" stroke="#059669" stroke-width="3"/>
    <circle cx="240" cy="100" r="3.5" fill="#047857"/>
    <circle cx="160" cy="180" r="3.5" fill="#047857"/>
    <text x="245" y="95" font-family="sans-serif" font-size="11" fill="#047857">(1, 1)</text>
    <text x="110" y="195" font-family="sans-serif" font-size="11" fill="#047857">(-1, -1)</text>
    <text x="310" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857">Hyperbole</text>
  </g>

  <!-- PANEL 3: f(x) = √x (Bottom-Left) -->
  <g transform="translate(30, 350)">
    <rect width="400" height="260" fill="#f8fafc" rx="8" stroke="#cbd5e1"/>
    <text x="200" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">دالة الجذر التربيعي: f(x) = √x</text>
    <text x="200" y="50" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">معرفة ومتزايدة تماماً على [0, +∞[</text>
    <!-- Axes: Origin (70, 210) -->
    <line x1="50" y1="210" x2="370" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="70" y1="245" x2="70" y2="60" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- Curve: y = sqrt(x) -->
    <path d="M 70 210 Q 110 130 190 110 T 360 80" fill="none" stroke="#d97706" stroke-width="3"/>
    <circle cx="70" cy="210" r="4" fill="#b45309"/>
    <circle cx="120" cy="160" r="3.5" fill="#b45309"/>
    <circle cx="220" cy="120" r="3.5" fill="#b45309"/>
    <circle cx="340" cy="90" r="3.5" fill="#b45309"/>
    <text x="125" y="155" font-family="sans-serif" font-size="11" fill="#b45309">(1, 1)</text>
    <text x="225" y="115" font-family="sans-serif" font-size="11" fill="#b45309">(4, 2)</text>
    <text x="340" y="85" font-family="sans-serif" font-size="11" fill="#b45309">(9, 3)</text>
    <text x="250" y="180" font-family="sans-serif" font-size="12" fill="#64748b">مماس عمودي عند المبدأ (0,0)</text>
  </g>

  <!-- PANEL 4: f(x) = |x| (Bottom-Right) -->
  <g transform="translate(470, 350)">
    <rect width="400" height="260" fill="#f8fafc" rx="8" stroke="#cbd5e1"/>
    <text x="200" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c3aed" text-anchor="middle">دالة القيمة المطلقة: f(x) = |x|</text>
    <text x="200" y="50" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">متناقصة على ]-∞, 0] ومتزايدة على [0, +∞[ (دالة زوجية)</text>
    <!-- Axes: Origin (200, 210) -->
    <line x1="30" y1="210" x2="370" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="200" y1="245" x2="200" y2="60" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- V-shape lines -->
    <line x1="80" y1="90" x2="200" y2="210" stroke="#7c3aed" stroke-width="3"/>
    <line x1="200" y1="210" x2="320" y2="90" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="200" cy="210" r="4" fill="#6d28d9"/>
    <text x="70" y="80" font-family="sans-serif" font-size="12" fill="#7c3aed">y = -x (x &lt; 0)</text>
    <text x="270" y="80" font-family="sans-serif" font-size="12" fill="#7c3aed">y = x (x ≥ 0)</text>
    <text x="200" y="235" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">نقطة زاوية (غير قابلة للاشتقاق عند 0)</text>
  </g>
</svg>