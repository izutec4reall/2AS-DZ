<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="auto">
  <defs>
    <marker id="arr-pol" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-rad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="450" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    الإحداثيات القطبية والتحويل الديكارتي-القطبي (Coordonnées Polaires)
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    تعيين موضع النقطة M بالثنائية (r, θ) والعلاقة: x = r·cos θ ، y = r·sin θ
  </text>

  <!-- Left: Geometric Diagram (Center O at 220, 310) -->
  <g transform="translate(30, 80)">
    <!-- Axes -->
    <line x1="30" y1="230" x2="350" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr-pol)"/>
    <text x="355" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">x</text>
    <line x1="80" y1="260" x2="80" y2="20" stroke="#334155" stroke-width="2" marker-end="url(#arr-pol)"/>
    <text x="85" y="15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">y</text>
    <circle cx="80" cy="230" r="4" fill="#0f172a"/>
    <text x="65" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>

    <!-- Concentric reference circles (r = 80, 160, 240) -->
    <circle cx="80" cy="230" r="70" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="80" cy="230" r="140" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="80" cy="230" r="210" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Point M at r = 210, θ = 36.87° (dx = 168, dy = -126 -> x = 248, y = 104) -->
    <!-- Vector OM -->
    <line x1="80" y1="230" x2="248" y2="104" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-rad)"/>
    <circle cx="248" cy="104" r="6" fill="#dc2626"/>
    <text x="255" y="98" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">M(r, θ) = M(x, y)</text>

    <!-- Radius vector label r -->
    <text x="155" y="155" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">r = ||OM||</text>

    <!-- Angle arc θ at O -->
    <path d="M 130 230 A 50 50 0 0 0 120 200" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="135" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">θ</text>

    <!-- Projections to cartesian axes -->
    <line x1="248" y1="104" x2="248" y2="230" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="248" y1="104" x2="80" y2="104" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="248" y="250" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">x = r cos θ</text>
    <text x="35" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="end">y = r sin θ</text>
  </g>

  <!-- Right: Conversion Formulas Panel -->
  <g transform="translate(440, 95)">
    <rect width="320" height="260" fill="#ffffff" rx="8" stroke="#cbd5e1"/>
    <text x="160" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">قوانين التحويل المزدوج :</text>
    
    <!-- From Polar to Cartesian -->
    <rect x="20" y="55" width="280" height="85" fill="#eff6ff" rx="6" stroke="#bfdbfe"/>
    <text x="160" y="78" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">1. من القطبي (r, θ) إلى الديكارتي (x, y) :</text>
    <text x="160" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">x = r · cos(θ)</text>
    <text x="160" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">y = r · sin(θ)</text>

    <!-- From Cartesian to Polar -->
    <rect x="20" y="155" width="280" height="90" fill="#f0fdf4" rx="6" stroke="#86efac"/>
    <text x="160" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">2. من الديكارتي (x, y) إلى القطبي (r, θ) :</text>
    <text x="160" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">r = √(x² + y²)   (r ≥ 0)</text>
    <text x="160" y="228" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">cos θ = x / r   ,   sin θ = y / r</text>
  </g>

  <!-- Bottom Example Banner -->
  <rect x="40" y="380" width="720" height="55" fill="#fef3c7" rx="6" stroke="#fde047"/>
  <text x="400" y="405" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">
    مثال تطبيقي: النقطة A(1, √3) ⟹ r = √(1 + 3) = 2 و cos θ = 1/2 و sin θ = √3/2 ⟹ θ = π/3 ⟹ A[2, π/3]
  </text>
</svg>