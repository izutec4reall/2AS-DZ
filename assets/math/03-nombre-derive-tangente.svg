<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="auto">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="450" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>

  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    العدد المشتق كمعامل توجيه المماس والتقريب التآلفي
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    Interprétation géométrique du nombre dérivé : pente de la tangente en A(x0, f(x0))
  </text>

  <!-- Axes (Origin at 120, 380) -->
  <line x1="80" y1="380" x2="740" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="745" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">x</text>
  <line x1="120" y1="420" x2="120" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="125" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">y</text>

  <!-- Curve (Cf) -->
  <path d="M 140 360 Q 300 340 450 200 T 700 90" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <text x="710" y="100" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">(Cf)</text>

  <!-- Point A (360, 270) -> x0 = 360, y0 = 270 -->
  <!-- Tangent line (T) at A: slope m = -0.75 in screen coords (positive math slope) -->
  <line x1="180" y1="375" x2="560" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <text x="570" y="155" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">(T): y = f'(x₀)(x - x₀) + f(x₀)</text>

  <!-- Secant line AM: M at (520, 160) -->
  <line x1="260" y1="330" x2="620" y2="100" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="630" y="115" font-family="sans-serif" font-size="13" fill="#64748b">قاطع (AM) نحو المماس</text>

  <!-- Points A and M -->
  <circle cx="360" cy="270" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="335" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">A(x₀, f(x₀))</text>

  <circle cx="520" cy="160" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="530" y="170" font-family="sans-serif" font-size="13" fill="#2563eb">M(x₀+h, f(x₀+h))</text>

  <!-- Slope Triangle (Δx = h, Δy = f(x0+h) - f(x0)) -->
  <line x1="360" y1="270" x2="520" y2="270" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="520" y1="270" x2="520" y2="160" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="430" y="290" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669">Δx = h</text>
  <text x="530" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669">Δy</text>

  <!-- Projections to X axis -->
  <line x1="360" y1="270" x2="360" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="360" y="402" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">x₀</text>

  <line x1="520" y1="160" x2="520" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="520" y="402" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">x₀ + h</text>

  <!-- Projections to Y axis -->
  <line x1="120" y1="270" x2="360" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="275" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="end">f(x₀)</text>

  <line x1="120" y1="160" x2="520" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="165" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="end">f(x₀ + h)</text>

  <!-- Info Box -->
  <rect x="150" y="90" width="240" height="75" fill="#eff6ff" rx="6" stroke="#93c5fd"/>
  <text x="270" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">معامل التوجيه (Pente) :</text>
  <text x="270" y="138" font-family="sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">f'(x₀) = lim [f(x₀+h) - f(x₀)] / h</text>
  <text x="270" y="156" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">عندما h تؤول إلى 0</text>
</svg>