<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <defs>
    <marker id="arr-poly" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="420" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    دراسة إشارة وتمثيل كثير الحدود من الدرجة الثانية : f(x) = ax² + bx + c
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    حالات المميز Δ = b² - 4ac (المميز الموجب، المعدوم، والسالب) مع a &gt; 0
  </text>

  <!-- Panel 1: Δ > 0 (Two real roots) -->
  <g transform="translate(30, 90)">
    <rect width="230" height="230" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
    <text x="115" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Δ &gt; 0 (جذران متمايزان)</text>
    <line x1="20" y1="140" x2="210" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-poly)"/>
    <line x1="115" y1="210" x2="115" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Parabola crossing axis at x1=65, x2=165 -->
    <path d="M 45 60 Q 115 220 185 60" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="65" cy="140" r="4" fill="#dc2626"/>
    <circle cx="165" cy="140" r="4" fill="#dc2626"/>
    <text x="65" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">x₁</text>
    <text x="165" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">x₂</text>
    <circle cx="115" cy="180" r="3.5" fill="#1e3a8a"/>
    <text x="115" y="200" font-family="sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">الذروة S</text>
    <text x="115" y="100" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="middle">بين الجذرين: عكس إشارة a</text>
  </g>

  <!-- Panel 2: Δ = 0 (Double root) -->
  <g transform="translate(285, 90)">
    <rect width="230" height="230" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
    <text x="115" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">Δ = 0 (جذر مضاعف)</text>
    <line x1="20" y1="160" x2="210" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-poly)"/>
    <line x1="115" y1="210" x2="115" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Parabola tangent at x0=115, y=160 -->
    <path d="M 50 60 Q 115 260 180 60" fill="none" stroke="#059669" stroke-width="2.5"/>
    <circle cx="115" cy="160" r="4" fill="#dc2626"/>
    <text x="115" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">x₀ = -b/2a</text>
    <text x="115" y="100" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="middle">من نفس إشارة a دائماً</text>
  </g>

  <!-- Panel 3: Δ < 0 (No real roots) -->
  <g transform="translate(540, 90)">
    <rect width="230" height="230" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
    <text x="115" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">Δ &lt; 0 (لا توجد جذور حقيقية)</text>
    <line x1="20" y1="180" x2="210" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-poly)"/>
    <line x1="115" y1="210" x2="115" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Parabola strictly above axis -->
    <path d="M 50 70 Q 115 230 180 70" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="115" y="100" font-family="sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle">لا تقطع المحور أبداً</text>
    <text x="115" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">إشارة موجبة تماماً</text>
  </g>

  <!-- Sign Table Summary below -->
  <rect x="50" y="340" width="700" height="70" fill="#ffffff" rx="6" stroke="#94a3b8"/>
  <text x="400" y="365" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">
    قاعدة الإشارة العامة : داخل مجال الجذرين (عكس إشارة a) وخارج مجال الجذرين (نفس إشارة a)
  </text>
  <text x="400" y="390" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">
    إحداثيات الذروة : S( -b / (2a) , -Δ / (4a) ) ومحور التناظر هو المستقيم ذو المعادلة : x = -b / (2a)
  </text>
</svg>