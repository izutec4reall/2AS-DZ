<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="auto">
  <defs>
    <marker id="arrc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <text x="350" y="45" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">
    الدائرة المثلثية والزوايا الشهيرة (Cercle Trigonométrique)
  </text>

  <!-- Main Circle: Center (350, 370), Radius R = 220 -->
  <circle cx="350" cy="370" r="220" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Axes -->
  <line x1="80" y1="370" x2="620" y2="370" stroke="#334155" stroke-width="2" marker-end="url(#arrc)"/>
  <text x="630" y="375" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">cos θ</text>
  <text x="580" y="395" font-family="sans-serif" font-size="14" fill="#334155">+1</text>
  <text x="115" y="395" font-family="sans-serif" font-size="14" fill="#334155">-1</text>

  <line x1="350" y1="640" x2="350" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrc)"/>
  <text x="360" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">sin θ</text>
  <text x="365" y="155" font-family="sans-serif" font-size="14" fill="#334155">+1</text>
  <text x="365" y="600" font-family="sans-serif" font-size="14" fill="#334155">-1</text>
  <text x="335" y="390" font-family="sans-serif" font-size="14" fill="#64748b">O</text>

  <!-- Angles to plot: (deg, label, cos_val, sin_val) -->
  <line x1="350" y1="370" x2="570.0" y2="370.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="570.0" cy="370.0" r="4" fill="#dc2626"/>
  <text x="595.0" y="370.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">0</text>
  <line x1="350" y1="370" x2="540.5" y2="260.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="540.5" cy="260.0" r="4" fill="#dc2626"/>
  <text x="562.2" y="250.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">π/6 (30°)</text>
  <line x1="350" y1="370" x2="505.6" y2="214.4" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="505.6" cy="214.4" r="4" fill="#dc2626"/>
  <text x="523.2" y="200.3" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">π/4 (45°)</text>
  <line x1="350" y1="370" x2="460.0" y2="179.5" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="460.0" cy="179.5" r="4" fill="#dc2626"/>
  <text x="472.5" y="162.2" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">π/3 (60°)</text>
  <line x1="350" y1="370" x2="350.0" y2="150.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="350.0" cy="150.0" r="4" fill="#dc2626"/>
  <text x="350.0" y="130.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">π/2 (90°)</text>
  <line x1="350" y1="370" x2="240.0" y2="179.5" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="240.0" cy="179.5" r="4" fill="#dc2626"/>
  <text x="227.5" y="162.2" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2π/3</text>
  <line x1="350" y1="370" x2="194.4" y2="214.4" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="194.4" cy="214.4" r="4" fill="#dc2626"/>
  <text x="176.8" y="200.3" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3π/4</text>
  <line x1="350" y1="370" x2="159.5" y2="260.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="159.5" cy="260.0" r="4" fill="#dc2626"/>
  <text x="137.8" y="250.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5π/6</text>
  <line x1="350" y1="370" x2="130.0" y2="370.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="130.0" cy="370.0" r="4" fill="#dc2626"/>
  <text x="105.0" y="370.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">π (180°)</text>
  <line x1="350" y1="370" x2="159.5" y2="480.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="159.5" cy="480.0" r="4" fill="#dc2626"/>
  <text x="137.8" y="490.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">7π/6</text>
  <line x1="350" y1="370" x2="194.4" y2="525.6" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="194.4" cy="525.6" r="4" fill="#dc2626"/>
  <text x="176.8" y="539.7" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5π/4</text>
  <line x1="350" y1="370" x2="240.0" y2="560.5" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="240.0" cy="560.5" r="4" fill="#dc2626"/>
  <text x="227.5" y="577.8" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4π/3</text>
  <line x1="350" y1="370" x2="350.0" y2="590.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="350.0" cy="590.0" r="4" fill="#dc2626"/>
  <text x="350.0" y="610.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3π/2</text>
  <line x1="350" y1="370" x2="460.0" y2="560.5" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="460.0" cy="560.5" r="4" fill="#dc2626"/>
  <text x="472.5" y="577.8" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5π/3</text>
  <line x1="350" y1="370" x2="505.6" y2="525.6" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="505.6" cy="525.6" r="4" fill="#dc2626"/>
  <text x="523.2" y="539.7" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">7π/4</text>
  <line x1="350" y1="370" x2="540.5" y2="480.0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="540.5" cy="480.0" r="4" fill="#dc2626"/>
  <text x="562.2" y="490.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">11π/6</text>
  <!-- Legend Box -->
  <rect x="440" y="550" width="230" height="110" fill="#f0fdf4" rx="8" stroke="#86efac"/>
  <text x="555" y="575" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">النسب المثلثية الشهيرة :</text>
  <text x="555" y="598" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">cos(π/6) = √3/2 , sin(π/6) = 1/2</text>
  <text x="555" y="620" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">cos(π/4) = √2/2 , sin(π/4) = √2/2</text>
  <text x="555" y="642" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">cos(π/3) = 1/2 , sin(π/3) = √3/2</text>
</svg>