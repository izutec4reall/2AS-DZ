<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="820" height="420" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="425" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    حالات عدم التعيين الأربعة وطرق إزالتها (Formes Indéterminées)
  </text>
  <text x="425" y="70" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    الخريطة الإرشادية لطرق التبسيط الجبري في المنهاج الجزائري
  </text>

  <!-- 4 Big Cases Columns -->
  <!-- Case 1: 0/0 -->
  <g transform="translate(40, 95)">
    <rect width="175" height="235" fill="#ffffff" rx="8" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="175" height="45" fill="#fef2f2" rx="8 8 0 0"/>
    <text x="87" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">" 0 / 0 "</text>
    <text x="87" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">طرق المعالجة :</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#334155">• التحليل والاختزال</text>
    <text x="25" y="125" font-family="sans-serif" font-size="11" fill="#64748b">استخراج (x - x₀)</text>
    <text x="15" y="155" font-family="sans-serif" font-size="12" fill="#334155">• الضرب في المرافق</text>
    <text x="25" y="175" font-family="sans-serif" font-size="11" fill="#64748b">في وجود الجذور التربيعية</text>
    <text x="15" y="205" font-family="sans-serif" font-size="12" fill="#334155">• تعريف العدد المشتق</text>
  </g>

  <!-- Case 2: inf/inf -->
  <g transform="translate(235, 95)">
    <rect width="175" height="235" fill="#ffffff" rx="8" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="175" height="45" fill="#eff6ff" rx="8 8 0 0"/>
    <text x="87" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="middle">" ∞ / ∞ "</text>
    <text x="87" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">طرق المعالجة :</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#334155">• الحد الأعلى درجة</text>
    <text x="25" y="125" font-family="sans-serif" font-size="11" fill="#64748b">في الدوال الناطقة عند ∞</text>
    <text x="15" y="155" font-family="sans-serif" font-size="12" fill="#334155">• استخراج عامل مشترك</text>
    <text x="25" y="175" font-family="sans-serif" font-size="11" fill="#64748b">من البسط والمقام</text>
    <text x="15" y="205" font-family="sans-serif" font-size="12" fill="#334155">• إخراج x² من الجذر</text>
    <text x="25" y="222" font-family="sans-serif" font-size="10" fill="#dc2626">انتبه: √(x²) = |x|</text>
  </g>

  <!-- Case 3: +inf - inf -->
  <g transform="translate(430, 95)">
    <rect width="175" height="235" fill="#ffffff" rx="8" stroke="#d97706" stroke-width="1.5"/>
    <rect width="175" height="45" fill="#fffbeb" rx="8 8 0 0"/>
    <text x="87" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#d97706" text-anchor="middle">" +∞ - ∞ "</text>
    <text x="87" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">طرق المعالجة :</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#334155">• المرافق (Conjugé)</text>
    <text x="25" y="125" font-family="sans-serif" font-size="11" fill="#64748b">إذا تساوى معاملا x</text>
    <text x="15" y="155" font-family="sans-serif" font-size="12" fill="#334155">• العامل المشترك</text>
    <text x="25" y="175" font-family="sans-serif" font-size="11" fill="#64748b">إذا اختلف المعاملان</text>
    <text x="15" y="205" font-family="sans-serif" font-size="12" fill="#334155">• النشر والتبسيط</text>
  </g>

  <!-- Case 4: 0 x inf -->
  <g transform="translate(625, 95)">
    <rect width="175" height="235" fill="#ffffff" rx="8" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="175" height="45" fill="#f5f3ff" rx="8 8 0 0"/>
    <text x="87" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7c3aed" text-anchor="middle">" 0 × ∞ "</text>
    <text x="87" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">طرق المعالجة :</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#334155">• النشر والتحويل</text>
    <text x="25" y="125" font-family="sans-serif" font-size="11" fill="#64748b">إلى مجموع نهايات</text>
    <text x="15" y="155" font-family="sans-serif" font-size="12" fill="#334155">• التحويل إلى قسمة</text>
    <text x="25" y="175" font-family="sans-serif" font-size="11" fill="#64748b">A × B = A / (1/B)</text>
    <text x="15" y="205" font-family="sans-serif" font-size="12" fill="#334155">• وضع مجهول مساعد</text>
  </g>

  <!-- Bottom Alert Bar -->
  <rect x="40" y="350" width="760" height="55" fill="#f0fdf4" rx="8" stroke="#86efac"/>
  <text x="420" y="382" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">
    تنبيه: الحالات التالية ليست عدم تعيين: (+∞) + (+∞) = +∞  |  (k / 0 = ∞)  |  (k / ∞ = 0)  |  (0 / ∞ = 0)
  </text>
</svg>