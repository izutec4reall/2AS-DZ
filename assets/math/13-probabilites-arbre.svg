<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="420" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    شجرة الاحتمالات وقانون الاحتمال الكلي (Arbre de Probabilité)
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    الاحتمال الشرطي P_A(B) ودستور الاحتمالات الكلية : P(B) = P(A)·P_A(B) + P(Ā)·P_Ā(B)
  </text>

  <!-- Root Ω (100, 240) -->
  <circle cx="100" cy="240" r="6" fill="#0f172a"/>
  <text x="80" y="245" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Ω</text>

  <!-- Stage 1 branches -->
  <!-- Branch to A (300, 160) -->
  <line x1="100" y1="240" x2="300" y2="160" stroke="#2563eb" stroke-width="2.5"/>
  <text x="190" y="185" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">P(A) = 0.6</text>
  <circle cx="300" cy="160" r="5" fill="#2563eb"/>
  <text x="315" y="165" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">A</text>

  <!-- Branch to A_bar (300, 320) -->
  <line x1="100" y1="240" x2="300" y2="320" stroke="#64748b" stroke-width="2.5"/>
  <text x="190" y="305" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">P(Ā) = 0.4</text>
  <circle cx="300" cy="320" r="5" fill="#64748b"/>
  <text x="315" y="325" font-family="sans-serif" font-size="16" font-weight="bold" fill="#64748b">Ā</text>

  <!-- Stage 2 from A -->
  <!-- A -> B (520, 110) -->
  <line x1="300" y1="160" x2="520" y2="110" stroke="#059669" stroke-width="2"/>
  <text x="400" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#059669">P_A(B) = 0.7</text>
  <text x="535" y="115" font-family="sans-serif" font-size="15" font-weight="bold" fill="#059669">B</text>
  <text x="590" y="115" font-family="sans-serif" font-size="13" fill="#0f172a">==&gt; P(A ∩ B) = 0.6 × 0.7 = 0.42</text>

  <!-- A -> B_bar (520, 200) -->
  <line x1="300" y1="160" x2="520" y2="200" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">P_A(B̄) = 0.3</text>
  <text x="535" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">B̄</text>
  <text x="590" y="205" font-family="sans-serif" font-size="13" fill="#0f172a">==&gt; P(A ∩ B̄) = 0.6 × 0.3 = 0.18</text>

  <!-- Stage 2 from A_bar -->
  <!-- A_bar -> B (520, 280) -->
  <line x1="300" y1="320" x2="520" y2="280" stroke="#059669" stroke-width="2"/>
  <text x="400" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#059669">P_Ā(B) = 0.2</text>
  <text x="535" y="285" font-family="sans-serif" font-size="15" font-weight="bold" fill="#059669">B</text>
  <text x="590" y="285" font-family="sans-serif" font-size="13" fill="#0f172a">==&gt; P(Ā ∩ B) = 0.4 × 0.2 = 0.08</text>

  <!-- A_bar -> B_bar (520, 360) -->
  <line x1="300" y1="320" x2="520" y2="360" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="355" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">P_Ā(B̄) = 0.8</text>
  <text x="535" y="365" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">B̄</text>
  <text x="590" y="365" font-family="sans-serif" font-size="13" fill="#0f172a">==&gt; P(Ā ∩ B̄) = 0.4 × 0.8 = 0.32</text>

  <!-- Result box -->
  <rect x="180" y="390" width="440" height="35" fill="#f0fdf4" rx="5" stroke="#86efac"/>
  <text x="400" y="413" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">
    الاحتمال الكلي : P(B) = 0.42 + 0.08 = 0.50 (50%)
  </text>
</svg>