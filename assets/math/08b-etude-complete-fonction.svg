<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="420" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    المخطط النموذجي الشامل لدراسة دالة (Étude Complète de Fonction)
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    الخطوات المنهجية الست: من مجموعة التعريف حتى رسم المنحنى (Cf)
  </text>

  <!-- Step Boxes -->
  <g transform="translate(60, 95)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="190" height="75" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="95" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">1. مجموعة التعريف والشفعية</text>
    <text x="95" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Df ، الزوجية، الفردية، التناظر</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="195" y1="37" x2="235" y2="37" stroke="#334155" stroke-width="2"/>

    <!-- Step 2 -->
    <rect x="245" y="0" width="190" height="75" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="340" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">2. النهايات والمقاربات</text>
    <text x="340" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">عند أطراف Df وإزالة ع.ت</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="440" y1="37" x2="480" y2="37" stroke="#334155" stroke-width="2"/>

    <!-- Step 3 -->
    <rect x="490" y="0" width="190" height="75" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="585" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">3. الاشتقاقية والتغيرات</text>
    <text x="585" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">حساب f'(x) ودراسة إشارتها</text>
  </g>

  <g transform="translate(60, 200)">
    <!-- Step 4 -->
    <rect x="0" y="0" width="190" height="75" fill="#f0fdf4" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="95" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">4. جدول التغيرات الكامل</text>
    <text x="95" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">إشارة المشتقة والأسهم والقيم</text>

    <!-- Arrow 4 -> 5 -->
    <line x1="195" y1="37" x2="235" y2="37" stroke="#334155" stroke-width="2"/>

    <!-- Step 5 -->
    <rect x="245" y="0" width="190" height="75" fill="#f0fdf4" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="340" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">5. النقاط المساعدة والمماسات</text>
    <text x="340" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">التقاطع مع المحاور والمماس (T)</text>

    <!-- Arrow 5 -> 6 -->
    <line x1="440" y1="37" x2="480" y2="37" stroke="#334155" stroke-width="2"/>

    <!-- Step 6 -->
    <rect x="490" y="0" width="190" height="75" fill="#fdf2f8" stroke="#ec4899" stroke-width="2" rx="6"/>
    <text x="585" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9d174d" text-anchor="middle">6. الإنشاء البياني الدقيق</text>
    <text x="585" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">رسم المعلم، المقاربات، و (Cf)</text>
  </g>

  <!-- Methodology Tip -->
  <rect x="60" y="315" width="680" height="90" fill="#ffffff" rx="6" stroke="#94a3b8"/>
  <text x="400" y="345" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">
    نصيحة بيداغوجية للاختبارات والبكالوريا :
  </text>
  <text x="400" y="370" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">
    ابدأ برسم المستقيمات المقاربة أولاً، ثم عيّن النقط الحدية والمماسات الأفقية، وأخيراً ارسم المنحنى بسلاسة محترماً اتجاه التغيرات.
  </text>
</svg>