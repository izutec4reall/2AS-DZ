<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .grid { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 1; }
      .axis { stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; }
      .curve { fill: none; stroke: #38bdf8; stroke-width: 4; stroke-linecap: round; }
      .bound-line { stroke: #f43f5e; stroke-width: 2.5; stroke-dasharray: 6 6; }
      .minor-line { stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 6 6; }
      .tangent { stroke: #fbbf24; stroke-width: 2; stroke-linecap: round; }
      .point { fill: #f8fafc; stroke-width: 2.5; }
      .pt-max { fill: #f43f5e; stroke: #fff; }
      .pt-min { fill: #10b981; stroke: #fff; }
      .text { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #f1f5f9; }
      .text-title { font-size: 20px; font-weight: bold; fill: #e2e8f0; text-anchor: middle; }
      .text-sub { font-size: 13px; fill: #94a3b8; text-anchor: middle; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; }
      .card { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="850" height="480" class="bg" rx="12"/>
  <text x="425" y="32" class="text text-title">حصر الدوال، المحدودية والقيم الحدية (Encadrement et Extremums)</text>
  <text x="425" y="52" class="text text-sub">دالة محدودة، عنصر حاد أعلى (Majorant)، عنصر حاد أدنى (Minorant)، وقيم حدية محلية ومطلقة</text>

  <!-- Coordinate system -->
  <line x1="80" y1="240" x2="620" y2="240" class="axis" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="70" class="axis" marker-end="url(#arrow)"/>
  <text x="615" y="265" class="text math" font-size="16">x</text>
  <text x="100" y="85" class="text math" font-size="16">y</text>
  <text x="105" y="255" class="text math">O</text>

  <!-- Majorant line y = M -->
  <line x1="120" y1="120" x2="600" y2="120" class="bound-line"/>
  <text x="130" y="112" class="text" fill="#f43f5e" font-weight="bold">y = M (عنصر حاد من الأعلى - Majorant : f(x) ≤ M)</text>

  <!-- Minorant line y = m -->
  <line x1="120" y1="390" x2="600" y2="390" class="minor-line"/>
  <text x="130" y="410" class="text" fill="#10b981" font-weight="bold">y = m (عنصر حاد من الأدنى - Minorant : f(x) ≥ m)</text>

  <!-- The function curve -->
  <!-- Starts at (140, 310), goes to Max at (260, 120), down to local min at (380, 290), up to local max at (470, 180), down to global min at (540, 390), end at (580, 330) -->
  <path d="M 140 310 Q 190 120 260 120 T 380 290 T 470 180 T 540 390 T 580 330" class="curve"/>

  <!-- Tangents at extrema -->
  <!-- At (260, 120) -->
  <line x1="210" y1="120" x2="310" y2="120" class="tangent" stroke-width="3"/>
  <circle cx="260" cy="120" r="6" class="point pt-max"/>
  <line x1="260" y1="120" x2="260" y2="240" stroke="#f43f5e" stroke-dasharray="3 3"/>
  <text x="255" y="255" class="text math">x₁</text>
  <text x="260" y="100" class="text" fill="#f43f5e" text-anchor="middle" font-weight="bold">قيمة حدية عظمى مطلقة M = f(x₁)</text>
  <text x="260" y="145" class="text" fill="#fbbf24" font-size="12" text-anchor="middle">f'(x₁) = 0</text>

  <!-- At (380, 290) local min -->
  <line x1="340" y1="290" x2="420" y2="290" class="tangent"/>
  <circle cx="380" cy="290" r="5" class="point" fill="#38bdf8" stroke="#fff"/>
  <line x1="380" y1="240" x2="380" y2="290" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="375" y="235" class="text math">x₂</text>
  <text x="380" y="315" class="text" fill="#38bdf8" font-size="12" text-anchor="middle">قيمة حدية صغرى محلية</text>

  <!-- At (470, 180) local max -->
  <line x1="430" y1="180" x2="510" y2="180" class="tangent"/>
  <circle cx="470" cy="180" r="5" class="point" fill="#38bdf8" stroke="#fff"/>
  <line x1="470" y1="180" x2="470" y2="240" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="465" y="255" class="text math">x₃</text>
  <text x="470" y="165" class="text" fill="#38bdf8" font-size="12" text-anchor="middle">قيمة حدية عظمى محلية</text>

  <!-- At (540, 390) global min -->
  <line x1="500" y1="390" x2="580" y2="390" class="tangent" stroke-width="3"/>
  <circle cx="540" cy="390" r="6" class="point pt-min"/>
  <line x1="540" y1="240" x2="540" y2="390" stroke="#10b981" stroke-dasharray="3 3"/>
  <text x="545" y="255" class="text math">x₄</text>
  <text x="540" y="430" class="text" fill="#10b981" text-anchor="middle" font-weight="bold">قيمة حدية صغرى مطلقة m = f(x₄)</text>

  <!-- Right side Summary Card -->
  <rect x="640" y="80" width="195" height="375" class="card"/>
  <text x="737" y="110" class="text" font-weight="bold" fill="#38bdf8" text-anchor="middle">خلاصة القوانين</text>

  <rect x="650" y="125" width="175" height="70" fill="#0f172a" rx="5"/>
  <text x="737" y="145" class="text" fill="#f43f5e" font-weight="bold" font-size="12" text-anchor="middle">دالة محدودة من الأعلى</text>
  <text x="737" y="165" class="text math" font-size="13" text-anchor="middle">∃ M ∈ ℝ : ∀x, f(x) ≤ M</text>
  <text x="737" y="182" class="text" font-size="11" fill="#94a3b8" text-anchor="middle">M هو عنصر حاد أعلى</text>

  <rect x="650" y="205" width="175" height="70" fill="#0f172a" rx="5"/>
  <text x="737" y="225" class="text" fill="#10b981" font-weight="bold" font-size="12" text-anchor="middle">دالة محدودة من الأدنى</text>
  <text x="737" y="245" class="text math" font-size="13" text-anchor="middle">∃ m ∈ ℝ : ∀x, f(x) ≥ m</text>
  <text x="737" y="262" class="text" font-size="11" fill="#94a3b8" text-anchor="middle">m هو عنصر حاد أدنى</text>

  <rect x="650" y="285" width="175" height="65" fill="#0f172a" rx="5"/>
  <text x="737" y="305" class="text" fill="#fbbf24" font-weight="bold" font-size="12" text-anchor="middle">دالة محدودة (Bornée)</text>
  <text x="737" y="325" class="text math" font-size="12" text-anchor="middle">m ≤ f(x) ≤ M</text>
  <text x="737" y="340" class="text math" font-size="12" text-anchor="middle">|f(x)| ≤ K</text>

  <rect x="650" y="360" width="175" height="85" fill="#0f172a" rx="5"/>
  <text x="737" y="380" class="text" fill="#a78bfa" font-weight="bold" font-size="12" text-anchor="middle">مبرهنة القيم الحدية</text>
  <text x="737" y="400" class="text" font-size="11" fill="#cbd5e1" text-anchor="middle">إذا انعدمت f' وغيرت</text>
  <text x="737" y="417" class="text" font-size="11" fill="#cbd5e1" text-anchor="middle">إشارتها عند x₀ فـ f(x₀)</text>
  <text x="737" y="434" class="text" font-size="11" fill="#cbd5e1" text-anchor="middle">قيمة حدية محلية</text>
</svg>