<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="auto">
  <defs>
    <marker id="arr-asym" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="450" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    المستقيمات المقاربة الثلاثة لمنحنى دالة (Asymptotes)
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    المقارب العمودي (x = x₀)، المقارب الأفقي (y = L)، والمقارب المائل (Δ : y = ax + b)
  </text>

  <!-- Axes (Origin at 300, 260) -->
  <line x1="50" y1="260" x2="740" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arr-asym)"/>
  <text x="745" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">x</text>
  <line x1="300" y1="430" x2="300" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#arr-asym)"/>
  <text x="305" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">y</text>

  <!-- 1. Vertical Asymptote at x = 1 (x = 360 px) -->
  <line x1="360" y1="90" x2="360" y2="420" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="365" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">مقارب عمودي: x = 1</text>

  <!-- 2. Oblique Asymptote: y = 0.5x + 1 -> points (100, 310) to (700, 160) -->
  <line x1="80" y1="315" x2="720" y2="155" stroke="#059669" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="640" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">مقارب مائل (Δ): y = ax + b</text>

  <!-- 3. Horizontal Asymptote at y = -2 (y = 360 px) on left -->
  <line x1="60" y1="360" x2="300" y2="360" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="70" y="350" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">مقارب أفقي: y = L</text>

  <!-- Curve (Cf) branches -->
  <!-- Left branch approaching x=1 from left to -infinity, and approaching y=-2 on far left -->
  <path d="M 80 358 Q 200 355 280 380 T 350 430" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <!-- Right branch approaching x=1 from right to +infinity, and approaching oblique asymptote on far right -->
  <path d="M 370 95 Q 400 240 500 210 T 720 160" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <text x="520" y="225" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">(Cf)</text>

  <!-- Definition Badge -->
  <rect x="440" y="350" width="310" height="85" fill="#eff6ff" rx="6" stroke="#93c5fd"/>
  <text x="595" y="375" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">شرط المقارب المائل :</text>
  <text x="595" y="398" font-family="sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">lim [f(x) - (ax + b)] = 0 عندما x → ±∞</text>
  <text x="595" y="420" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">إشارة الفرق تحدد الوضع النسبي بين (Cf) و (Δ)</text>
</svg>