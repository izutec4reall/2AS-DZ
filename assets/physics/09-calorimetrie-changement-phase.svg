<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="420" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    التحويلات الحرارية وتغير الحالة الفيزيائية والمسعرية (Calorimétrie)
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    التحويل المحسوس Q = m·c·ΔT والتحويل الكامن Q = m·L والتوازن الحراري Σ Q = 0
  </text>

  <!-- Heating Curve Graph (Left): Temperature vs Heat added -->
  <g transform="translate(60, 100)">
    <rect width="360" height="260" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
    <text x="180" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">منحنى تسخين الماء (Chauffage de l'eau)</text>
    <!-- Axes -->
    <line x1="50" y1="220" x2="340" y2="220" stroke="#334155" stroke-width="1.5"/>
    <text x="345" y="225" font-family="sans-serif" font-size="11" fill="#334155">Q (J)</text>
    <line x1="50" y1="220" x2="50" y2="40" stroke="#334155" stroke-width="1.5"/>
    <text x="45" y="35" font-family="sans-serif" font-size="11" fill="#334155">T (°C)</text>

    <!-- Temperature marks -->
    <text x="40" y="180" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="end">0°C</text>
    <line x1="47" y1="175" x2="53" y2="175" stroke="#334155"/>
    <text x="40" y="105" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="end">100°C</text>
    <line x1="47" y1="100" x2="53" y2="100" stroke="#334155"/>

    <!-- Curve parts -->
    <!-- 1. Ice heating: (50, 210) to (90, 175) -->
    <line x1="50" y1="210" x2="90" y2="175" stroke="#0284c7" stroke-width="2.5"/>
    <text x="65" y="200" font-family="sans-serif" font-size="9" fill="#0284c7">جليد</text>

    <!-- 2. Melting plateau (Fusion) at 0°C: (90, 175) to (160, 175) -->
    <line x1="90" y1="175" x2="160" y2="175" stroke="#2563eb" stroke-width="3"/>
    <text x="125" y="165" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">انصهار Q = m·L_f</text>

    <!-- 3. Liquid heating: (160, 175) to (230, 100) -->
    <line x1="160" y1="175" x2="230" y2="100" stroke="#059669" stroke-width="2.5"/>
    <text x="185" y="130" font-family="sans-serif" font-size="10" fill="#059669">ماء سائل</text>

    <!-- 4. Boiling plateau (Vaporisation) at 100°C: (230, 100) to (310, 100) -->
    <line x1="230" y1="100" x2="310" y2="100" stroke="#dc2626" stroke-width="3"/>
    <text x="270" y="90" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">غليان Q = m·L_v</text>
  </g>

  <!-- Calorimeter Apparatus (Right) -->
  <g transform="translate(470, 100)">
    <rect width="270" height="260" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
    <text x="135" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">المسعر الحراري (Calorimètre)</text>
    
    <!-- Outer insulated vessel -->
    <rect x="50" y="70" width="170" height="160" fill="#e2e8f0" stroke="#64748b" stroke-width="2" rx="8"/>
    <!-- Inner vessel -->
    <rect x="65" y="90" width="140" height="130" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    
    <!-- Thermometer -->
    <rect x="100" y="45" width="8" height="150" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <circle cx="104" cy="195" r="7" fill="#dc2626"/>
    <text x="80" y="45" font-family="sans-serif" font-size="11" fill="#dc2626">محرار</text>

    <!-- Stirrer (Agitateur) -->
    <path d="M 160 45 L 160 190 L 180 190" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="185" y="55" font-family="sans-serif" font-size="11" fill="#475569">مخلاط</text>

    <text x="135" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ماء (m₁, c₁, T₁)</text>
    <text x="135" y="245" font-family="sans-serif" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">جملة معزولة حرارياً : Σ Q = 0</text>
  </g>

  <!-- Bottom Formula -->
  <rect x="60" y="380" width="680" height="40" fill="#f8fafc" rx="6" stroke="#94a3b8"/>
  <text x="400" y="405" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
    السعة الحرارية للمسعر ومحتوياته : C_cal = μ · c_eau  ==&gt;  Q_cal = C_cal (T_f - T_i)
  </text>
</svg>