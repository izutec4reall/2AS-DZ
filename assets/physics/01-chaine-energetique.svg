<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="auto">
  <defs>
    <marker id="arrp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="820" height="450" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>

  <text x="425" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    النموذج المقارن: السلسلة الوظيفية والسلسلة الطاقوية
  </text>
  <text x="425" y="70" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    مثال تركيبي: اشتغال مصباح وتدفئة غرفة بواسطة سقوط حجر
  </text>

  <!-- 1. CHAINE FONCTIONNELLE (Top) -->
  <g transform="translate(0, 90)">
    <text x="50" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e40af">1. السلسلة الوظيفية (أفعال الحالة والأداء) :</text>
    
    <!-- Bubble 1: حجر -->
    <ellipse cx="140" cy="80" rx="60" ry="32" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">حجر</text>
    <text x="140" y="96" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">يسقط</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="205" y1="80" x2="280" y2="80" stroke="#0f172a" stroke-width="2" marker-end="url(#arrp)"/>
    <text x="242" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">يُدير</text>

    <!-- Bubble 2: دينامو -->
    <ellipse cx="350" cy="80" rx="65" ry="32" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="350" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">دينامو (منوب)</text>
    <text x="350" y="96" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">يدور</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="420" y1="80" x2="495" y2="80" stroke="#0f172a" stroke-width="2" marker-end="url(#arrp)"/>
    <text x="458" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">يُغذّي</text>

    <!-- Bubble 3: مصباح -->
    <ellipse cx="565" cy="80" rx="65" ry="32" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="565" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">مصباح</text>
    <text x="565" y="96" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">يتوهج</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="635" y1="80" x2="705" y2="80" stroke="#0f172a" stroke-width="2" marker-end="url(#arrp)"/>
    <text x="670" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">يُضيء / يُدفئ</text>

    <!-- Bubble 4: الوسط الخارجي -->
    <ellipse cx="765" cy="80" rx="55" ry="32" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="765" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">الغرفة</text>
    <text x="765" y="96" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">تسخن وتضاء</text>
  </g>

  <!-- 2. CHAINE ENERGETIQUE (Bottom) -->
  <g transform="translate(0, 270)">
    <text x="50" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#047857">2. السلسلة الطاقوية (أشكال الطاقة وأنماط التحويل) :</text>
    
    <!-- Bubble 1: حجر + أرض -->
    <ellipse cx="140" cy="85" rx="65" ry="35" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">حجر + أرض</text>
    <text x="140" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Ec + Epp</text>

    <!-- Transfer arrow 1 -> 2: W (Mechanical) -->
    <line x1="210" y1="85" x2="280" y2="85" stroke="#047857" stroke-width="2.5" marker-end="url(#arrp)"/>
    <text x="245" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">W</text>

    <!-- Bubble 2: دينامو -->
    <ellipse cx="350" cy="85" rx="65" ry="35" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="350" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">دينامو</text>
    <text x="350" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Ec</text>

    <!-- Transfer arrow 2 -> 3: We (Electrical) -->
    <line x1="420" y1="85" x2="495" y2="85" stroke="#047857" stroke-width="2.5" marker-end="url(#arrp)"/>
    <text x="458" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">We</text>

    <!-- Bubble 3: مصباح -->
    <ellipse cx="565" cy="85" rx="65" ry="35" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="565" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">مصباح</text>
    <text x="565" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">Ei</text>

    <!-- Double Transfer Arrow: Er and Q -->
    <!-- Er (Radiative - useful) -->
    <line x1="635" y1="70" x2="705" y2="70" stroke="#047857" stroke-width="2.5" marker-end="url(#arrp)"/>
    <text x="670" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Er (مفيد)</text>
    <!-- Q (Thermal - dissipated) -->
    <line x1="635" y1="100" x2="705" y2="100" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrp)"/>
    <text x="670" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Q (ضائع)</text>

    <!-- Bubble 4: الوسط الخارجي -->
    <ellipse cx="765" cy="85" rx="55" ry="35" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="765" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">الغرفة</text>
    <text x="765" y="98" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Ei</text>
  </g>
</svg>