<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="auto">
  <defs>
    <marker id="arr-pl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="450" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="42" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    العمود الكهروكيميائي (عمود دانيال Daniell) وتفاعلات الأكسدة والإرجاع
  </text>
  <text x="400" y="66" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    حركة الإلكترونات في الدارة الخارجية وانتقال الشوارد عبر الجسر الملحي
  </text>

  <!-- Left Beaker (Anode: Zn / Zn2+) -->
  <rect x="120" y="220" width="160" height="150" fill="none" stroke="#334155" stroke-width="2" rx="6"/>
  <rect x="122" y="260" width="156" height="108" fill="#f1f5f9"/>
  <!-- Zinc plate (Anode - Negative pole) -->
  <rect x="150" y="180" width="22" height="150" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <text x="161" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">(-) مصعد (Zn)</text>

  <!-- Right Beaker (Cathode: Cu / Cu2+) -->
  <rect x="520" y="220" width="160" height="150" fill="none" stroke="#334155" stroke-width="2" rx="6"/>
  <rect x="522" y="260" width="156" height="108" fill="#dbeafe"/>
  <!-- Copper plate (Cathode - Positive pole) -->
  <rect x="628" y="180" width="22" height="150" fill="#ea580c" stroke="#334155" stroke-width="1.5"/>
  <text x="639" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">(+) مهبط (Cu)</text>

  <!-- Salt Bridge (Pont salin KNO3 / inverted U-tube) -->
  <path d="M 240 310 L 240 200 L 560 200 L 560 310" fill="none" stroke="#ca8a04" stroke-width="18" stroke-linecap="round"/>
  <path d="M 240 310 L 240 200 L 560 200 L 560 310" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round"/>
  <text x="400" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">جسر ملحي (K⁺ + NO₃⁻)</text>

  <!-- Connecting Wires and Resistor/Voltmeter -->
  <line x1="161" y1="180" x2="161" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="161" y1="105" x2="360" y2="105" stroke="#334155" stroke-width="2"/>
  
  <!-- Voltmeter in center -->
  <circle cx="400" cy="105" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="112" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">V</text>

  <line x1="422" y1="105" x2="639" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="639" y1="105" x2="639" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Electron Flow Arrow (from Zn to Cu) -->
  <line x1="220" y1="90" x2="320" y2="90" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-pl)"/>
  <text x="270" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">تيار الإلكترونات (e⁻)</text>

  <!-- Labels on solutions -->
  <text x="200" y="350" font-family="sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">محلول (Zn²⁺ + SO₄²⁻)</text>
  <text x="600" y="350" font-family="sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">محلول (Cu²⁺ + SO₄²⁻)</text>

  <!-- Half reactions below -->
  <rect x="80" y="385" width="240" height="45" fill="#fef2f2" rx="6" stroke="#fca5a5"/>
  <text x="200" y="405" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">عند المصعد (أكسدة الأنود) :</text>
  <text x="200" y="422" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Zn(s) ⟶ Zn²⁺(aq) + 2e⁻</text>

  <rect x="480" y="385" width="240" height="45" fill="#f0fdf4" rx="6" stroke="#86efac"/>
  <text x="600" y="405" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">عند المهبط (إرجاع الكاثود) :</text>
  <text x="600" y="422" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Cu²⁺(aq) + 2e⁻ ⟶ Cu(s)</text>
</svg>