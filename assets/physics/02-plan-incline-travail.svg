<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto">
  <defs>
    <marker id="arr-force" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-f2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-f3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="470" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>

  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    حركة جسم على مستو مائل وتمثيل القوى وحساب العمل
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    Travail d'une force constante sur un plan incliné : W(P) = m·g·h, W(f) = -f·AB, W(R) = 0
  </text>

  <!-- Ground Line -->
  <line x1="80" y1="420" x2="720" y2="420" stroke="#334155" stroke-width="3"/>

  <!-- Inclined Plane Triangle: Base at y=420 from x=150 to x=650. Height at x=150 is h=180 (y=240) -->
  <!-- A is top (180, 240), B is bottom (620, 420) -->
  <polygon points="180,240 620,420 180,420" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>

  <!-- Height line h -->
  <line x1="150" y1="240" x2="150" y2="420" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="140" y1="240" x2="180" y2="240" stroke="#059669" stroke-width="1.5"/>
  <text x="130" y="335" font-family="sans-serif" font-size="16" font-weight="bold" fill="#059669" text-anchor="end">h</text>

  <!-- Points A and B -->
  <circle cx="210" cy="252" r="4" fill="#1e3a8a"/>
  <text x="200" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">A</text>
  <circle cx="600" cy="412" r="4" fill="#1e3a8a"/>
  <text x="615" y="440" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">B</text>

  <!-- Inclination angle α at B -->
  <path d="M 540 420 A 80 80 0 0 0 555 393" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="525" y="410" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b45309">α</text>

  <!-- Solid Box on incline: center around (380, 321), angle θ ≈ 22.2 deg -->
  <!-- Box rotated -->
  <g transform="translate(380, 321) rotate(22.2)">
    <rect x="-35" y="-25" width="70" height="50" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#1e40af"/>
    <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">(S)</text>
  </g>

  <!-- FORCES from Center (380, 321) -->
  <!-- 1. Gravity P (straight down) -->
  <line x1="380" y1="321" x2="380" y2="445" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-force)"/>
  <text x="390" y="440" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">P = m·g</text>

  <!-- 2. Normal Reaction R (perpendicular to incline: angle = 22.2 - 90 = -67.8 deg) -->
  <!-- dx = 80 * cos(-67.8°) = 30.2, dy = 80 * sin(-67.8°) = -74.1 -->
  <line x1="380" y1="321" x2="410" y2="247" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-f3)"/>
  <text x="420" y="245" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">R</text>

  <!-- 3. Friction force f (opposite to motion down: up the incline, angle 22.2 + 180 = 202.2°) -->
  <!-- dx = 60 * cos(202.2°) = -55.5, dy = 60 * sin(202.2°) = -22.6 -->
  <line x1="380" y1="321" x2="325" y2="298" stroke="#059669" stroke-width="3" marker-end="url(#arr-f2)"/>
  <text x="315" y="290" font-family="sans-serif" font-size="15" font-weight="bold" fill="#059669">f</text>

  <!-- Summary Card -->
  <rect x="490" y="90" width="280" height="150" fill="#ffffff" rx="8" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="630" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">أعمال القوى خلال الانتقال A → B :</text>
  <text x="510" y="142" font-family="sans-serif" font-size="13" fill="#dc2626">• عمل الثقل: W(P) = +m·g·h (محرك)</text>
  <text x="510" y="168" font-family="sans-serif" font-size="13" fill="#059669">• عمل الاحتكاك: W(f) = -f · AB (معيق)</text>
  <text x="510" y="194" font-family="sans-serif" font-size="13" fill="#2563eb">• عمل رد الفعل: W(R) = 0 (قوة عمودية)</text>
  <text x="510" y="222" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">ΔEc = Ec(B) - Ec(A) = W(P) + W(f)</text>
</svg>