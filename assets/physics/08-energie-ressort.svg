<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <defs>
    <marker id="arr-res" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="15" y="15" width="770" height="420" fill="#f8fafc" rx="8" stroke="#e2e8f0"/>
  <text x="400" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    الطاقة الكامنة المرونية وتشوه نابض : Epe = ½ k · x²
  </text>
  <text x="400" y="70" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    قوة الارتداد T = -k · x وعمل قوة النابض وانحفاظ الطاقة الميكانيكية
  </text>

  <!-- Wall on left -->
  <rect x="80" y="120" width="15" height="240" fill="#64748b"/>
  <line x1="80" y1="120" x2="80" y2="360" stroke="#334155" stroke-width="2"/>
  <!-- Ground -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="#334155" stroke-width="2"/>

  <!-- STATE 1: Equilibrium x = 0 (Top) -->
  <g transform="translate(0, 150)">
    <text x="110" y="-10" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">1. موضع التوازن والراحة (x = 0) :</text>
    <!-- Spring coils -->
    <path d="M 95 25 L 130 25 L 140 10 L 155 40 L 170 10 L 185 40 L 200 10 L 215 40 L 230 10 L 245 40 L 255 25 L 290 25" fill="none" stroke="#475569" stroke-width="2.5"/>
    <!-- Box at rest (290 to 350) -->
    <rect x="290" y="0" width="60" height="50" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="320" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">(S)</text>
    <line x1="320" y1="0" x2="320" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="320" y="95" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">x = 0 (Epe = 0)</text>
  </g>

  <!-- STATE 2: Stretched by x (Bottom) -->
  <g transform="translate(0, 260)">
    <text x="110" y="-10" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">2. حالة استطالة بمقدار x :</text>
    <!-- Stretched Spring coils -->
    <path d="M 95 25 L 140 25 L 155 8 L 180 42 L 205 8 L 230 42 L 255 8 L 280 42 L 305 8 L 330 42 L 345 25 L 390 25" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Box stretched to x = 390 -->
    <rect x="390" y="0" width="60" height="50" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="420" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">(S)</text>
    <line x1="420" y1="0" x2="420" y2="80" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="420" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">x</text>

    <!-- Restoring force vector T pointing left -->
    <line x1="390" y1="25" x2="330" y2="25" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-res)"/>
    <text x="360" y="15" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">T = -k·x</text>

    <!-- Distance arrow x between 320 and 420 -->
    <line x1="320" y1="65" x2="420" y2="65" stroke="#2563eb" stroke-width="2"/>
    <text x="370" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">الاستطالة x</text>
  </g>

  <!-- Energy Summary Card -->
  <rect x="510" y="130" width="250" height="180" fill="#ffffff" rx="6" stroke="#cbd5e1"/>
  <text x="635" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">حصيلة الطاقة المرونية :</text>
  <text x="530" y="195" font-family="sans-serif" font-size="13" fill="#1e40af">• عبارة الطاقة : Epe = ½ k x²</text>
  <text x="530" y="225" font-family="sans-serif" font-size="13" fill="#dc2626">• عمل قوة النابض :</text>
  <text x="545" y="250" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">W(T) = ½ k x₁² - ½ k x₂²</text>
  <text x="530" y="285" font-family="sans-serif" font-size="12" fill="#059669">• k : ثابت المرونة بوحدة (N/m)</text>
</svg>